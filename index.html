.lockup{display:flex;align-items:center;gap:clamp(14px,2.5vw,32px);margin-bottom:36px;color:var(--y)}
.lockup .iso{width:clamp(76px,13vw,176px);flex:none}
.lockup .iso img{display:block;width:100%;height:auto}
.wordmark{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.82;letter-spacing:.02em;font-size:clamp(56px,12vw,168px)}
.wordmark span{display:block}
.tag{color:var(--y);font-family:var(--display);font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(32px,6vw,72px);line-height:1;margin:0 0 24px}
h1 span{color:var(--y)}
.lead{max-width:560px;margin:0;color:#e4e4ea;font-size:21px;font-weight:300}
footer{background:var(--ink);border-top:1px solid #2a2a33;padding:28px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.social{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.social a{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--y);border:2px solid var(--y);transition:background .2s,color .2s,transform .2s}
.social a svg{width:22px;height:22px}
.social a:hover,.social a:focus-visible{background:var(--y);color:var(--ink);transform:translateY(-3px);outline:0}
</style>
